name: Original-architecture alignment + offline tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional encrypted-memory test dependency
        run: python -m pip install "cryptography>=42,<49"
      - name: Compare with ORIGINAL v0.4 (mandatory)
        run: python tools/check_architecture.py --strict
      - name: Legacy skill regression tests
        run: python -m unittest discover -s skills/personal-finance-planner/tests -p 'test_*.py' -q
      - name: Repo tests including Skill-first architecture
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Optional calculator five-case smoke
        shell: bash
        run: |
          for city in shenzhen shanghai new-york chicago cn-hk-pf; do
            python skills/personal-finance-planner/scripts/wealth_v5.py run \
              --input "skills/personal-finance-planner/examples/v5-$city.json" --format json >/dev/null
          done
      - name: Verify committed content manifest (v5.5)
        run: python tools/manifest.py --verify
      - name: Professional full-plan synthetic acceptance (NOT a real host A/B test)
        run: |
          python skills/personal-finance-planner/scripts/plan_quality.py \
            --input skills/personal-finance-planner/examples/v5.3-consultation-shenzhen-SYNTHETIC.json
          if python skills/personal-finance-planner/scripts/plan_quality.py \
            --input skills/personal-finance-planner/examples/v5.3-generic-failure-SYNTHETIC.json; then
            echo 'ERROR: generic non-client-specific response passed mandatory gate' >&2
            exit 1
          fi

      - name: v5.4 value math counterfactual and review smoke (hypothetical only)
        run: |
          python skills/personal-finance-planner/scripts/value_math.py project \
            --input skills/personal-finance-planner/examples/v5.4-spending-behavior-SYNTHETIC.json > /dev/null
          python skills/personal-finance-planner/scripts/value_math.py project \
            --input skills/personal-finance-planner/examples/v5.4-reallocate-not-new-savings-SYNTHETIC.json > /dev/null
          python skills/personal-finance-planner/scripts/value_math.py review \
            --input skills/personal-finance-planner/examples/v5.4-followup-SYNTHETIC.json > /dev/null
      - name: v5.4 value-card acceptance and deliberate negative
        shell: bash
        run: |
          python skills/personal-finance-planner/scripts/value_quality.py \
            --input skills/personal-finance-planner/examples/v5.4-value-card-SYNTHETIC.json
          if python skills/personal-finance-planner/scripts/value_quality.py \
            --input skills/personal-finance-planner/examples/v5.4-value-card-INVALID-SYNTHETIC.json; then
            echo 'ERROR: false value/double counting report passed check' >&2
            exit 1
          fi

      - name: v5.5 synthetic trader ledger and report-quality smoke
        shell: bash
        run: |
          ledger="$(mktemp)"
          trap 'rm -f "$ledger"' EXIT
          python skills/personal-finance-planner/scripts/trader_wealth_reconcile.py \
            --input skills/personal-finance-planner/examples/v5.5-crossborder-mixed-trader-SYNTHETIC.json > "$ledger"
          python skills/personal-finance-planner/scripts/trader_plan_quality.py \
            --ledger "$ledger" \
            --plan skills/personal-finance-planner/examples/v5.5-client-value-card-SYNTHETIC.json

      - name: v5.6 Personal Wealth Master Plan structural and negative smoke
        shell: bash
        run: |
          python skills/personal-finance-planner/scripts/master_plan_quality.py --input skills/personal-finance-planner/examples/v5.6-high-income-trader-SYNTHETIC.json
          python skills/personal-finance-planner/scripts/master_plan_quality.py --input skills/personal-finance-planner/examples/v5.6-salary-shenzhen-SYNTHETIC.json
          if python skills/personal-finance-planner/scripts/master_plan_quality.py --input skills/personal-finance-planner/examples/v5.6-invalid-double-count-SYNTHETIC.json; then
            echo 'ERROR: v5.6 negative fixture passed' >&2
            exit 1
          fi

      - name: v5.6.1 verified schema negative regression + human AB scoring harness smoke
        shell: bash
        run: |
          python skills/personal-finance-planner/scripts/master_plan_quality.py --input skills/personal-finance-planner/examples/v5.6-high-income-trader-SYNTHETIC.json
          python -m unittest tests.test_master_plan_v561 tests.test_blind_eval_v561 -q
          python tests/skill_vs_baseline/evaluate_blind.py \
            --scores tests/skill_vs_baseline/SAMPLE_ONLY_scores_v561.json \
            --unblind tests/skill_vs_baseline/SAMPLE_ONLY_unblind_v561.json >/dev/null
